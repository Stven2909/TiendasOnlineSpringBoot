<div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <i class="fas fa-user-plus register-icon"></i>
        <h2>Crear Cuenta</h2>
      </div>
  
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
  
      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>
  
      <form (ngSubmit)="onSubmit()" class="register-form">
        <div class="form-row">
          <div class="form-group">
            <label for="nombre"><i class="fas fa-user"></i> Nombre *</label>
            <input type="text" id="nombre" [(ngModel)]="usuario.nombre" name="nombre" required>
          </div>
  
          <div class="form-group">
            <label for="apellido"><i class="fas fa-user"></i> Apellido *</label>
            <input type="text" id="apellido" [(ngModel)]="usuario.apellido" name="apellido" required>
          </div>
        </div>
  
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email *</label>
          <input type="email" id="email" [(ngModel)]="usuario.email" name="email" required>
        </div>
  
        <div class="form-row">
          <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Contraseña *</label>
            <input type="password" id="password" [(ngModel)]="usuario.password" name="password" required>
          </div>
  
          <div class="form-group">
            <label for="confirmPassword"><i class="fas fa-lock"></i> Confirmar Contraseña *</label>
            <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required>
          </div>
        </div>
  
        <div class="form-group">
          <label for="direccion"><i class="fas fa-map-marker-alt"></i> Dirección</label>
          <input type="text" id="direccion" [(ngModel)]="usuario.direccion" name="direccion">
        </div>
  
        <div class="form-group">
          <label for="telefono"><i class="fas fa-phone"></i> Teléfono</label>
          <input type="tel" id="telefono" [(ngModel)]="usuario.telefono" name="telefono">
        </div>
  
        <button type="submit" class="register-submit-btn">
          <i class="fas fa-user-plus"></i> Registrarse
        </button>
  
        <div class="register-footer">
          <p>¿Ya tienes cuenta? <a href="#" (click)="goToLogin(); $event.preventDefault()">Iniciar Sesión</a></p>
        </div>
      </form>
    </div>
  </div>
